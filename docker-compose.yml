services:
  trmnl-kids:
    image: ghcr.io/cpaulik/kinder-wien-trmnl:latest
    restart: unless-stopped
    environment:
      TRMNL_WEBHOOK_URL: ${TRMNL_WEBHOOK_URL}
      INTERVAL: 1800
      MAX_AGE_REQUIREMENT: 4
      DISPLAY_COUNT: 6
      # SOURCES: falter,wienxtra,umweltspuernasen,wiengv,tmw
    volumes:
      - cache:/cache

volumes:
  cache:
