# Add this service next to trmnl-kino on arcane. The kids plugin needs its own
# private plugin in TRMNL, so TRMNL_WEBHOOK_URL is a different UUID from the
# films one - reusing the kino webhook would overwrite the films screen.
services:
  trmnl-kids:
    image: ghcr.io/cpaulik/kinder-wien-trmnl:latest
    restart: unless-stopped
    environment:
      TRMNL_WEBHOOK_URL: ${TRMNL_KIDS_WEBHOOK_URL}
      INTERVAL: 1800
      MAX_AGE_REQUIREMENT: 4
      DISPLAY_COUNT: 4
      TZ: Europe/Vienna
      # SOURCES: falter,wienxtra,umweltspuernasen,wiengv,tmw
    volumes:
      - kids-cache:/cache

volumes:
  kids-cache:
