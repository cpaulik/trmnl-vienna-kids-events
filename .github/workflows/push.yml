name: Push events to TRMNL

# Alternative to running the container: GitHub does the scheduling.
# Needs the repository secret TRMNL_WEBHOOK_URL.
#
# Caveats worth knowing before relying on this:
#   - schedule is best effort. Runs are delayed under load and occasionally
#     dropped entirely. That matters much less here than it looks: each payload
#     carries several screens and the template rotates between them on its own
#     clock, so a late or missed run costs freshness, not movement.
#   - GitHub disables scheduled workflows in a public repository after 60 days
#     without activity. keepalive.yml exists to prevent that.
#   - minutes are free on public repositories. On a private one, 48 runs a day
#     will exceed the free tier.

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: trmnl-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Without this the schedule fails every two hours on a repo that is
      # deployed by Docker instead, which is noise rather than information.
      - name: Skip unless a webhook is configured
        id: guard
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: |
          if [ -z "$TRMNL_WEBHOOK_URL" ]; then
            echo "No TRMNL_WEBHOOK_URL secret set - this repo is presumably run"
            echo "from Docker instead. Nothing to do."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.configured == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: pip install --no-cache-dir requests beautifulsoup4

      - name: Resolve today in Vienna time
        id: date
        if: steps.guard.outputs.configured == 'true'
        run: echo "today=$(TZ=Europe/Vienna date +%F)" >> "$GITHUB_OUTPUT"

      # The pool is scraped once a day and reused. Without this, every run would
      # re-fetch a few hundred pages, which is slow and impolite to the sources.
      # Keyed on the date: the first run of the day misses and saves the pool,
      # every later run hits it exactly and skips the scrape.
      - name: Restore today's event pool
        uses: actions/cache@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          path: cache
          key: events-${{ steps.date.outputs.today }}

      - name: Push a screen
        if: steps.guard.outputs.configured == 'true'
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
          CACHE_DIR: cache
          TZ: Europe/Vienna
          DISPLAY_COUNT: "4"
          MAX_AGE_REQUIREMENT: "4"
        run: |
          mkdir -p cache
          python scraper.py
