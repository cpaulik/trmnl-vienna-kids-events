name: Keepalive

# GitHub switches off scheduled workflows in a public repository after 60 days
# with no repository activity, with nothing but a banner in the Actions tab to
# tell you. A commit once a month resets that clock, so push.yml keeps running
# on a repo that nobody touches.

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record a heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "Keep the scheduled workflow enabled" || exit 0
          git push
